<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oila shajarasi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#f6efe2;--bg2:#d9ead9;--ink:#23312a;--mut:#667266;--card1:#fff;--card2:#eef3ea;--edge:#b9c7b4;--gold:#c28a1c;--line:#2f7a58;--pane:#ffffffb8;--m:#3b82c4;--f:#d9577f;--sh:#2a3d3050}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0d1a15;--bg2:#1c2b3a;--ink:#f1ead8;--mut:#9fb0a4;--card1:#2c3b35;--card2:#1b2723;--edge:#0a120f;--gold:#f0c35a;--line:#6fe0a8;--pane:#16221dcc;--m:#6bb3ff;--f:#ff8fb0;--sh:#000a}}
:root[data-theme="dark"]{--bg1:#0d1a15;--bg2:#1c2b3a;--ink:#f1ead8;--mut:#9fb0a4;--card1:#2c3b35;--card2:#1b2723;--edge:#0a120f;--gold:#f0c35a;--line:#6fe0a8;--pane:#16221dcc;--m:#6bb3ff;--f:#ff8fb0;--sh:#000a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 "Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,var(--bg2),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:var(--gold);top:-80px;right:-60px}.o2{width:360px;height:360px;background:var(--line);bottom:-120px;left:-100px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.15)}}
header,nav,main{position:relative;z-index:1;max-width:1500px;margin:auto}
header{padding:22px 18px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 clamp(1.7rem,5vw,2.8rem) Georgia,serif;background:linear-gradient(90deg,var(--gold),var(--line));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:.9rem}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--pane);border:1px solid var(--edge);border-radius:12px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
button:active{transform:translateY(3px);box-shadow:none}
button.p{background:linear-gradient(135deg,var(--line),var(--gold));color:#10201a;border:0;font-weight:700}
button.d{color:#d24b3a}
nav{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap}
nav button.on{background:var(--ink);color:var(--bg1)}
main{padding:0 14px 50px}.hide{display:none!important}.ro .ed{display:none!important}
.bn{background:var(--gold);color:#1b1608;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:.9rem}
.stage{background:var(--pane);border:1px solid var(--edge);border-radius:28px;padding:30px 10px 50px;overflow:auto;backdrop-filter:blur(8px);box-shadow:0 30px 60px -20px var(--sh);perspective:1400px}
.canvas{position:relative;display:flex;flex-direction:column;gap:76px;align-items:center;min-width:max-content;margin:auto;padding:10px 30px}
svg.ln{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.ln path{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:7 7;stroke-linecap:round;animation:fw 1.2s linear infinite;filter:drop-shadow(0 0 4px var(--line))}
svg.ln path.sp{stroke:var(--gold);stroke-dasharray:none;animation:none;stroke-width:4}
@keyframes fw{to{stroke-dashoffset:-14}}
.gen{position:relative;display:flex;gap:34px;justify-content:center;z-index:1}
.gl{position:absolute;left:-6px;top:-30px;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.cp{display:flex;gap:16px}
.pc{width:136px;padding:12px 10px 10px;border-radius:22px;text-align:center;cursor:pointer;background:linear-gradient(145deg,var(--card1),var(--card2));transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .15s,box-shadow .15s;box-shadow:inset 0 1px 0 #fff6,0 7px 0 var(--edge),0 24px 28px -8px var(--sh)}
.ph{width:84px;height:84px;margin:0 auto 8px;border-radius:20px;border:3px solid var(--c);background:var(--c) center/cover;display:grid;place-items:center;font:700 1.7rem Georgia,serif;color:#fff;transform:translateZ(28px);box-shadow:0 10px 16px -4px var(--sh),0 0 18px -2px var(--c)}
.pc.m{--c:var(--m)}.pc.f{--c:var(--f)}
.pc b{display:block;font-size:.92rem;line-height:1.2;transform:translateZ(16px)}.pc small{color:var(--mut);font-size:.76rem}
.box{background:var(--pane);border:1px solid var(--edge);border-radius:24px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--edge);border-radius:12px;background:var(--card2)}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.rw{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;cursor:pointer;background:var(--pane);border:1px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.rw .ph{width:50px;height:50px;margin:0;font-size:1.1rem;transform:none;border-radius:14px;flex:none}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{padding:18px;border-radius:20px;background:linear-gradient(145deg,var(--card1),var(--card2));box-shadow:0 7px 0 var(--edge),0 20px 30px -10px var(--sh);text-align:center}
.tile b{display:block;font:700 2.2rem Georgia,serif;color:var(--gold)}
.mut{color:var(--mut);font-size:.9rem}.empty{text-align:center;padding:50px 10px}a{color:var(--line)}
</style>
</head>
<body class="ro">
<div class="orb o1"></div><div class="orb o2"></div>
<header><div><h1>🌳 Oila shajarasi</h1><div class="sub" id="sub"></div></div>
<div class="ed"><button class="p" id="pub">🚀 Saytga chiqarish</button></div></header>
<nav><button data-t="tree" class="on">🌿 Shajara</button><button data-t="list">👥 Ro’yxat</button><button data-t="stats">📊 Statistika</button><button data-t="form" class="p ed">＋ Qo’shish</button></nav>
<main>
<div class="bn ed">✏️ Tahrirlash rejimi. O’zgarishlar faqat shu telefonda saqlanadi. Hamma ko’rishi uchun «🚀 Saytga chiqarish» ni bosing, yuklangan index.html ni GitHub’ga yuklang.</div>
<section id="tree" class="stage"></section>
<section id="list" class="hide"><input id="q" placeholder="🔎 Ism bo’yicha qidirish…"><div class="rows" id="rows"></div></section>
<section id="stats" class="hide st"></section>
<section id="form" class="box hide">
<h2 id="ft" style="margin-top:0">Yangi inson</h2>
<div class="grid">
<div><label>Ism familiya *</label><input id="name"></div>
<div><label>Jinsi</label><select id="gender"><option value="m">Erkak</option><option value="f">Ayol</option></select></div>
<div><label>Tug’ilgan yili</label><input id="born" inputmode="numeric" maxlength="4"></div>
<div><label>Vafot yili (tirik bo’lsa bo’sh)</label><input id="died" inputmode="numeric" maxlength="4"></div>
<div><label>Otasi</label><select id="father"></select></div>
<div><label>Onasi</label><select id="mother"></select></div>
<div><label>Turmush o’rtog’i</label><select id="spouse"></select></div>
<div><label>Tug’ilgan joyi</label><input id="place"></div>
<div><label>Surat</label><input id="pic" type="file" accept="image/*"></div>
</div>
<div style="margin-top:12px"><label>Izoh</label><textarea id="note" rows="3"></textarea></div>
<div class="acts"><button class="p" id="save">Saqlash</button><button id="cancel">Bekor qilish</button><button class="d hide" id="del">O’chirish</button></div>
</section>
<p class="mut"><span class="ro-only">Odam kartasini bossangiz, tafsilotlar chiqadi.</span> <a href="#" id="tg">✏️ Egasi uchun</a> <a href="#" id="clr" class="ed">· Hammasini tozalash</a></p>

nder":"m","born":"1948","died":"","place":"Toshkent","note":"","father":"","mother":"pmvrzpimn9p4","spouse":""},{"id":"pmvrzvdva0k2","name":"Fotima","gender":"f","born":"1951","died":"","place":"Toshkent","note":"","father":"","mother":"pmvrzpimn9p4","spouse":""},{"id":"pmvrzwgwyqj3","name":"Mahmudov Ibrohim","gender":"m","born":"1960","died":"","place":"Toshkent","note":"","father":"pmvrzmlalu5o","mother":"pmvrzno6l1e8","spouse":""},{"id":"pmvrzx5mguup","name":"Gulnora Mahmudova","gender":"f","born":"1962","died":"","place":"Toshkent","note":"","father":"pmvrzmlalu5o","mother":"pmvrzno6l1e8","spouse":""},{"id":"pmvrzy39bt3r","name":"Gulrsara Mahmudova","gender":"f","born":"1966","died":"","place":"Toshkent","note":"","father":"pmvrzmlalu5o","mother":"pmvrzno6l1e8","spouse":""},{"id":"pmvrzyovt6ct","name":"Mahmudov Rovshan","gender":"m","born":"1980","died":"","place":"Toshkent","note":"","father":"pmvrzmlalu5o","mother":"pmvrzno6l1e8","spouse":""},{"id":"pmvrzzfwq1s2","name":"Mahmudova Mohira","gender":"f","born":"2006","died":"","place":"Toshkent","note":"","father":"pmvrzyovt6ct","mother":"","spouse":""},{"id":"pmvs001qwsf0","name":"Meliboyev Mahmud","gender":"m","born":"2008","died":"","place":"Toshkent","note":"","father":"pmvrzyovt6ct","mother":"","spouse":""},{"id":"pmvs00ojzjfi","name":"Mahmudov Muhammadsolih","gender":"m","born":"2012","died":"","place":"Toshkent","note":"","father":"pmvrzyovt6ct","mother":"","spouse":""},{"id":"pmvs0197hcwa","name":"Mahmudova Robiya","gender":"m","born":"2015","died":"","place":"Toshkent","note":"","father":"pmvrzyovt6ct","mother":"","spouse":""},{"id":"pmvs02izm9ut","name":"Ismoil Mahmudov","gender":"m","born":"1970","died":"","place":"Toshkent","note":"","father":"pmvrzmlalu5o","mother":"pmvrzno6l1e8","spouse":""},{"id":"pmvs03d7rnys","name":"Inobat Melivoyeva","gender":"f","born":"2000","died":"","place":"Toshkent","note":"","father":"pmvs02izm9ut","mother":"","spouse":""},{"id":"pmvs065j4jfb","name":"Ilhom Melivoyev","gender":"m","born":"2004","died":"","place":"Toshkent","note":"","father":"pmvs02izm9ut","mother":"","spouse":""},{"id":"pmvs06rwudt1","name":"Laylo Melivoyeva","gender":"f","born":"2002","died":"","place":"","note":"","father":"pmvs02izm9ut","mother":"","spouse":""}]</script>

<script>
var people=[],editId=null,photo=null,DK="shajara-draft",EDIT=location.hash==="#edit";
function $(i){return document.getElementById(i)}
function load(){try{people=JSON.parse($("seed").textContent)}catch(e){people=[]}
if(EDIT){try{var d=localStorage.getItem(DK);if(d)people=JSON.parse(d)}catch(e){}}}
function store(){try{localStorage.setItem(DK,JSON.stringify(people))}catch(e){alert("Xotira to’ldi")}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function get(id){return people.filter(function(p){return p.id===id})[0]}
function yrs(p){return (p.born||"?")+(p.died?" – "+p.died:"")}
function ph(p){return '<div class="ph" style="'+(p.photo?"background-image:url("+p.photo+")":"")+'">'+(p.photo?"":esc((p.name||"?").trim().charAt(0).toUpperCase()))+'</div>'}
function card(p){return '<div class="pc '+p.gender+'" data-id="'+p.id+'">'+ph(p)+'<b>'+esc(p.name)+'</b><small>'+yrs(p)+(p.place?" · "+esc(p.place):"")+'</small></div>'}
function layout(){var gen={},rows=[],pos={};
people.forEach(function(p){gen[p.id]=0});
for(var i=0;i<60;i++){var ch=0;people.forEach(function(p){var g=gen[p.id];
[p.father,p.mother].forEach(function(x){if(x&&gen[x]!=null&&gen[x]+1>g)g=gen[x]+1});
var s=p.spouse&&gen[p.spouse];if(s>g)g=s;if(g!==gen[p.id]){gen[p.id]=g;ch=1}});if(!ch)break}
var mx=0;people.forEach(function(p){if(gen[p.id]>mx)mx=gen[p.id]});
function pk(p){return[p.father,p.mother].filter(function(x){return x&&pos[x]!=null}).map(function(x){return pos[x]})}
for(var g=0;g<=mx;g++){var L=people.filter(function(p){return gen[p.id]===g});
function key(p){var k=pk(p);if(!k.length&&p.spouse){var s=get(p.spouse);if(s)k=pk(s)}
return k.length?k.reduce(function(a,b){return a+b},0)/k.length:2}
L.sort(function(a,b){return key(a)-key(b)});
var done={},units=[];L.forEach(function(p){if(done[p.id])return;done[p.id]=1;var u=[p];
var s=p.spouse&&get(p.spouse);if(s&&gen[s.id]===g&&!done[s.id]){done[s.id]=1;u.push(s)}units.push(u)});
var n=0,tot=L.length;units.forEach(function(u){u.forEach(function(p){pos[p.id]=(n++)/Math.max(tot,1)})});rows.push(units)}
return rows}
function renderTree(){var T=$("tree");
if(!people.length){T.innerHTML='<div class="empty"><p style="font-size:3rem;margin:0">🌱</p><p>Shajara hali bo’sh.</p><div class="acts ed" style="justify-content:center"><button class="p" id="add0">＋ Birinchi insonni qo’shish</button></div></div>';
var b=$("add0");if(b)b.onclick=function(){openForm()};return}
var h='<div class="canvas" id="cv"><svg class="ln" id="ln"></svg>';
layout().forEach(function(units,i){h+='<div class="gen"><span class="gl">'+(i+1)+'-avlod</span>'+units.map(function(u){return '<div class="cp">'+u.map(card).join("")+'</div>'}).join("")+'</div>'});
T.innerHTML=h+"</div>";requestAnimationFrame(lines)}
function lines(){var cv=$("cv");if(!cv)return;var svg=$("ln"),R=cv.getBoundingClientRect(),d="";
svg.setAttribute("width",cv.scrollWidth);svg.setAttribute("height",cv.scrollHeight);
function B(id){var e=cv.querySelector('[data-id="'+id+'"]');if(!e)return null;var r=e.getBoundingClientRect();
return{x:r.left-R.left+r.width/2,t:r.top-R.top,b:r.bottom-R.top,y:r.top-R.top+r.height/2,l:r.left-R.left,r:r.right-R.left}}
people.forEach(function(p){var s=p.spouse&&get(p.spouse);if(s&&p.id<s.id){var a=B(p.id),b=B(s.id);
if(a&&b&&Math.abs(a.y-b.y)<5){var L=a.x<b.x?a:b,Rr=a.x<b.x?b:a;d+='<path class="sp" d="M'+L.r+" "+L.y+"H"+Rr.l+'"/>'}}});
people.forEach(function(c){var f=c.father&&B(c.father),m=c.mother&&B(c.mother),k=B(c.id);if(!k||!(f||m))return;
var x,y;if(f&&m){x=(f.x+m.x)/2;y=Math.max(f.b,m.b)}else{var q=f||m;x=q.x;y=q.b}
var ym=(y+k.t)/2;d+='<path d="M'+x+" "+y+"C"+x+" "+ym+","+k.x+" "+ym+","+k.x+" "+k.t+'"/>'});
svg.innerHTML=d}
function renderList(){var q=$("q").value.toLowerCase();
var a=people.filter(function(p){return p.name.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)});
$("rows").innerHTML=a.map(function(p){return '<div class="rw" data-id="'+p.id+'">'+ph(p)+'<div><b>'+esc(p.name)+'</b><br><small class="mut">'+yrs(p)+'</small></div></div>'}).join("")||'<p class="mut">Topilmadi.</p>'}
function renderStats(){var n=people.length,m=people.filter(function(p){return p.gender==="m"}).length,alive=people.filter(function(p){return!p.died}).length;
var ys=people.filter(function(p){return+p.born}).map(function(p){return+p.born});
var T=[["Jami",n],["Erkaklar",m],["Ayollar",n-m],["Tirik",alive],["Avlodlar",n?layout().length:0],["Eng qadimgi yil",ys.length?Math.min.apply(0,ys):"–"],["Eng yangi yil",ys.length?Math.max.apply(0,ys):"–"]];
$("stats").innerHTML=T.map(function(t){return '<div class="tile"><b>'+t[1]+'</b>'+t[0]+'</div>'}).join("")}
function fillSel(id,gender,cur){var o='<option value="">—</option>';
people.forEach(function(p){if((!gender||p.gender===gender)&&p.id!==editId)o+='<option value="'+p.id+'"'+(p.id===cur?" selected":"")+'>'+esc(p.name)+" ("+(p.born||"?")+")</option>"});$(id).innerHTML=o}
function show(t){["tree","list","stats","form"].forEach(function(x){$(x).classList.toggle("hide",x!==t)});
document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t&&t!=="form")});
$("sub").textContent=people.length+" nafar qarindosh";
if(t==="tree")renderTree();if(t==="list")renderList();if(t==="stats")renderStats()}
function openForm(id){editId=id||null;photo=null;var p=id?get(id):{gender:"m"};
$("ft").textContent=id?"Tahrirlash":"Yangi inson";
["name","born","died","place","note"].forEach(function(k){$(k).value=p[k]||""});$("gender").value=p.gender||"m";$("pic").value="";
fillSel("father","m",p.father);fillSel("mother","f",p.mother);fillSel("spouse","",p.spouse);
$("del").classList.toggle("hide",!id);show("form");window.scrollTo(0,0)}
$("pic").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var c=document.createElement("canvas");c.width=c.height=160;var s=Math.min(im.width,im.height);
c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);photo=c.toDataURL("image/jpeg",.75)};im.src=r.result};r.readAsDataURL(f)};
$("save").onclick=function(){var n=$("name").value.trim();if(!n){alert("Ismni kiriting");return}
var d={name:n,gender:$("gender").value,born:$("born").value.trim(),died:$("died").value.trim(),place:$("place").value.trim(),note:$("note").value.trim(),father:$("father").value,mother:$("mother").value,spouse:$("spouse").value};
var p=editId?get(editId):null;
if(p){if(p.spouse&&p.spouse!==d.spouse){var o=get(p.spouse);if(o&&o.spouse===p.id)o.spouse=""}Object.assign(p,d)}
else{p=Object.assign({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},d);people.push(p)}
if(photo)p.photo=photo;
if(d.spouse){var s=get(d.spouse);if(s)s.spouse=p.id}
store();show("tree")};
$("cancel").onclick=function(){show("tree")};
$("del").onclick=function(){if(!confirm("Rostdan o’chirasizmi?"))return;
people=people.filter(function(p){return p.id!==editId});
people.forEach(function(p){["father","mother","spouse"].forEach(function(k){if(p[k]===editId)p[k]=""})});store();show("tree")};
$("clr").onclick=function(e){e.preventDefault();if(confirm("Namuna odamlar va hamma ma’lumot o’chiriladi. Davom etasizmi?")){people=[];store();show("tree")}};
$("tg").onclick=function(e){e.preventDefault();location.hash=EDIT?"":"#edit";location.reload()};
function buildDoc(){var c=document.documentElement.cloneNode(true);
c.querySelector("#seed").textContent=JSON.stringify(people).replace(/</g,"\\u003c");
